<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>인터뷰 예약 확인</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="../../assets/augen.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font,'Pretendard Variable','Pretendard','Malgun Gothic',sans-serif);font-weight:350;letter-spacing:-.02em;background:var(--canvas);color:var(--ink);line-height:1.6;min-height:100vh;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:30px 20px 80px}
.hero,.card{background:var(--surface);border:.5px solid var(--hair);border-radius:22px;padding:24px;margin-bottom:16px}
.eyebrow{font-size:11px;color:var(--ash);margin-bottom:4px}
h1{font-size:21px;font-weight:500;line-height:1.35}
.desc{font-size:12px;color:var(--ash);margin-top:6px}
.result{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.date{font-size:18px;font-weight:550;margin-top:4px}
.time{font-size:15px;font-weight:500;margin-top:2px}
.code{font-size:11.5px;color:var(--ash);margin-top:12px}
.badge{font-size:11px;font-weight:550;color:var(--blue);background:var(--blue-wash);padding:7px 11px;border-radius:999px;white-space:nowrap}
.info{background:#eaf2ff;border-radius:14px;padding:13px 15px;color:#3d4b63;font-size:12px;line-height:1.7}
.lock{display:flex;gap:10px;align-items:flex-start;border-top:.5px solid var(--hair);padding-top:16px;margin-top:16px}
.lock-icon{width:30px;height:30px;border-radius:50%;background:var(--ink-wash);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lock-title{font-size:12.5px;font-weight:550}
.lock-text{font-size:11.5px;color:var(--ash);margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{border:none;border-radius:999px;padding:13px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.primary{background:var(--ink);color:#fff}.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--hair)}
.empty{text-align:center;padding:28px 10px;color:var(--ash);font-size:12px}
@media(max-width:620px){.wrap{padding:20px 14px 72px}.hero,.card{padding:18px}.result{grid-template-columns:1fr}.badge{justify-self:start}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="../assets/nav.js"></script>

<div class="wrap">
  <section class="hero">
    <div class="eyebrow">자원봉사자</div>
    <h1>인터뷰 예약 확인</h1>
    <div class="desc">직접 선택해 확정한 인터뷰 일정을 확인합니다.</div>
  </section>

  <section class="card" id="resultCard">
    <div id="resultBody"></div>
  </section>

  <section class="card">
    <div class="info">
      예약 확정 후 일정 변경이 필요하면 <b>문의하기</b>를 이용해 주십시오.<br><br><b>예약시간 15분 전까지 Zoom 대기실에 입장해 주세요. 인터뷰 진행 상황에 따라 예정 시간보다 조금 일찍 시작하거나 늦게 시작할 수 있습니다.</b>
    </div>
    <div class="lock">
      <div class="lock-icon">🔒</div>
      <div>
        <div class="lock-title">예약 확정</div>
        <div class="lock-text">예약코드당 하나의 인터뷰 시간만 확정할 수 있습니다.</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" onclick="goInquiry()">문의하기</button>
      <button class="btn secondary" onclick="goHome()">홈으로</button>
    </div>
  </section>
</div>

<script src="../assets/store.js"></script>
<script src="../assets/auth.js"></script>
<script>
function getSession(){
  try{ if(window.parent && window.parent!==window && window.parent.CAAuth) return window.parent.CAAuth.getSession(); }catch(e){}
  try{ return CAAuth.getSession(); }catch(e){ return null; }
}
var session=getSession();
if(!session || session.role!=='volunteer'){ location.href='01-applicant-submit.html'; }

function render(){
  var state=CAStore.load();
  var row=(state.applicants||[]).find(function(r){return r.reservationCode===session.code;});
  var body=document.getElementById('resultBody');
  if(!row || !row.slotId){
    body.innerHTML='<div class="empty">아직 확정된 인터뷰 예약이 없습니다.</div>';
    return;
  }
  var slot=(state.slots||[]).find(function(s){return s.id===row.slotId;});
  if(!slot){
    body.innerHTML='<div class="empty">배정 정보를 불러올 수 없습니다. 문의하기를 이용해 주십시오.</div>';
    return;
  }
  body.innerHTML=
    '<div class="result"><div>'
    +'<div class="eyebrow">확정된 인터뷰 예약</div>'
    +'<div class="date">'+CAStore.fmtDateShort(slot.date)+'</div>'
    +'<div class="time">'+slot.time+' · 30분 인터뷰</div>'
    +'<div class="code">예약코드 '+session.code+'</div>'
    +'</div><div class="badge">예약 확정</div></div>';
}
function goInquiry(){
  try{
    if(window.parent && window.parent!==window && typeof window.parent.setTab==='function'){
      window.parent.setTab('inquiry');
      if(typeof window.parent.setInquiry==='function') window.parent.setInquiry('helpdesk');
      return;
    }
  }catch(e){}
  location.href='04-helpdesk.html';
}
function goHome(){
  try{
    if(window.parent && window.parent!==window && typeof window.parent.setTab==='function'){window.parent.setTab('home');return;}
  }catch(e){}
  location.href='00-home.html';
}
render();
</script>
</body>
</html>
