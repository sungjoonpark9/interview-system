<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>역할별 FAQ</title><link rel="stylesheet" href="../../assets/augen.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font,'Malgun Gothic',sans-serif);word-break:keep-all}.wrap{max-width:720px;margin:auto;padding:24px 16px 80px}.toolbar{display:flex;gap:8px;margin-bottom:15px}input,textarea,select{width:100%;border:1px solid var(--hair);border-radius:13px;padding:11px;font:inherit}.item{background:#fff;border:.5px solid var(--hair);border-radius:16px;margin:8px 0;overflow:hidden}.q{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;font-size:13px}.a{display:none;padding:0 16px 15px;color:var(--steel);font-size:12px}.item.open .a{display:block}.admin{display:none;background:#fff;border:1px solid var(--blue);border-radius:18px;padding:18px;margin-bottom:16px}.admin.show{display:block}.admin textarea{min-height:75px;margin-top:8px}.btn{border:0;border-radius:99px;padding:10px 15px;background:var(--ink);color:#fff;cursor:pointer}.role{font-size:12px;color:var(--blue);margin-bottom:12px}.badge{font-size:9px;border-radius:99px;background:var(--blue-wash);color:var(--blue);padding:2px 7px;margin-right:6px}.del{display:block;margin-top:8px;color:#b5432b;cursor:pointer}
</style></head><body><script src="../assets/nav.js"></script><div class="topbar"><div class="brand"><div><h1>자주 묻는 질문</h1><div class="sub">로그인한 역할에 맞는 질문과 답변을 보여 줍니다</div></div></div><div class="tag">DEMO</div></div><div class="wrap"><div class="role" id="roleText"></div><div class="toolbar"><input id="search" placeholder="검색어 입력" oninput="render()"><button class="btn" id="adminBtn" style="display:none" onclick="toggleAdmin()">FAQ 관리</button></div><div class="admin" id="admin"><select id="aud"><option value="all">공통</option><option value="volunteer">자원봉사자</option><option value="interviewer">인터뷰어</option></select><input id="q" placeholder="질문" style="margin-top:8px"><textarea id="a" placeholder="답변"></textarea><button class="btn" onclick="addFaq()">등록</button></div><div id="list"></div></div><script src="../assets/store.js"></script><script src="../assets/auth.js"></script><script>
var session=CAAuth.getSession(),role=session?session.role:'volunteer',openId='',adminOn=false,isAdmin=['admin','system'].indexOf(role)>=0;function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}function roleName(r){return r==='volunteer'?'자원봉사자':r==='interviewer'?'인터뷰어':r==='all'?'공통':'관리자'}if(isAdmin)document.getElementById('adminBtn').style.display='block';document.getElementById('roleText').textContent=isAdmin?'전체 역할 FAQ를 관리합니다.':roleName(role)+'에게 필요한 FAQ만 표시됩니다.';
function toggleAdmin(){adminOn=!adminOn;document.getElementById('admin').classList.toggle('show',adminOn)}function toggle(id){openId=openId===id?'':id;render()}function addFaq(){var q=document.getElementById('q').value.trim(),a=document.getElementById('a').value.trim();if(!q||!a){alert('질문과 답변을 입력해 주세요.');return}var st=CAStore.load();st.faq.unshift({id:'F-'+Date.now(),audience:document.getElementById('aud').value,q:q,a:a,at:CAStore.nowLabel()});CAStore.save(st);document.getElementById('q').value='';document.getElementById('a').value='';render()}function del(id){var st=CAStore.load(),item=(st.faq||[]).find(function(f){return f.id===id});if(!item)return;if(!confirm('이 질문을 삭제할까요?\n\n'+item.q))return;st.faq=st.faq.filter(function(f){return f.id!==id});CAStore.save(st);render()}
function render(){var st=CAStore.load(),kw=document.getElementById('search').value.trim().toLowerCase(),list=(st.faq||[]).filter(function(f){return isAdmin||!f.audience||f.audience==='all'||f.audience===role}).filter(function(f){return !kw||(f.q+f.a).toLowerCase().indexOf(kw)>=0});document.getElementById('list').innerHTML=list.length?list.map(function(f){return '<div class="item'+(openId===f.id?' open':'')+'"><div class="q" onclick="toggle(\''+f.id+'\')"><span><span class="badge">'+roleName(f.audience||'all')+'</span>'+esc(f.q)+'</span><span>⌄</span></div><div class="a">'+esc(f.a)+(isAdmin?'<span class="del" onclick="event.stopPropagation();del(\''+f.id+'\')">질문 삭제</span>':'')+'</div></div>'}).join(''):'<div class="role">해당 FAQ가 없습니다.</div>'}render();
</script></body></html>
