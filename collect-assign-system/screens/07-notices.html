<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>역할별 공지사항</title><link rel="stylesheet" href="../../assets/augen.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font,'Malgun Gothic',sans-serif);word-break:keep-all}.wrap{max-width:720px;margin:auto;padding:24px 16px 80px}.intro{font-size:12px;color:var(--steel);margin-bottom:15px}.notice{background:#fff;border:.5px solid var(--hair);border-radius:18px;padding:17px;margin:9px 0}.head{display:flex;justify-content:space-between;gap:10px}.title{font-size:14px;font-weight:600}.meta{font-size:10px;color:var(--ash)}.body{font-size:12px;color:var(--steel);margin-top:8px}.aud{font-size:9px;border-radius:99px;padding:2px 7px;background:var(--blue-wash);color:var(--blue);margin-right:6px}.new{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#e5484d;color:#fff;font-size:10px;font-weight:700;margin-left:5px}.admin{display:none;background:#fff;border:1px solid var(--blue);border-radius:18px;padding:18px;margin-bottom:15px}.admin.show{display:block}input,textarea,select{width:100%;border:1px solid var(--hair);border-radius:12px;padding:10px;font:inherit;margin:4px 0}textarea{min-height:75px}.btn{border:0;border-radius:99px;padding:10px 15px;background:var(--ink);color:#fff;cursor:pointer}.toolbar{text-align:right;margin-bottom:10px}.del{font-size:10px;color:#b5432b;cursor:pointer;margin-top:9px;display:inline-block}

@media (min-width:900px){
  .wrap{max-width:820px;margin-left:auto;margin-right:auto;}
}

</style></head><body><script src="../assets/nav.js"></script><div class="topbar"><div class="brand"><div><h1>공지사항</h1><div class="sub">공통 공지와 로그인한 역할에 필요한 공지를 확인합니다</div></div></div><div class="tag">DEMO</div></div><div class="wrap"><div class="intro" id="intro"></div><div class="toolbar"><button class="btn" id="manageBtn" style="display:none" onclick="toggleAdmin()">공지 관리</button></div><div class="admin" id="admin"><select id="aud"><option value="all">전체</option><option value="volunteer">자원봉사자</option><option value="interviewer">인터뷰어</option><option value="helpdesk">콜센터</option><option value="admin">VM 관리자</option><option value="system">시스템 관리자</option></select><input id="title" placeholder="공지 제목"><textarea id="body" placeholder="공지 내용"></textarea><button class="btn" onclick="addNotice()">공지 등록</button></div><div id="list"></div></div><script src="../assets/store.js"></script><script src="../assets/auth.js"></script><script>
var session=CAAuth.getSession(),role=session?session.role:'volunteer',isAdmin=['admin','system'].indexOf(role)>=0,week=7*24*60*60*1000;function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}function name(r){return r==='volunteer'?'자원봉사자':r==='interviewer'?'인터뷰어':r==='helpdesk'?'콜센터':r==='admin'?'VM 관리자':r==='system'?'시스템 관리자':r==='all'?'전체':'운영'}function syncBadge(){try{if(parent!==window&&parent.updateNoticeBadge)parent.updateNoticeBadge()}catch(e){}}if(isAdmin)document.getElementById('manageBtn').style.display='inline-block';document.getElementById('intro').textContent=isAdmin?'전체 공지를 관리합니다.':'공통 공지와 '+name(role)+' 공지를 보여 줍니다. 등록 후 7일 이내 공지에는 N이 표시됩니다.';function toggleAdmin(){document.getElementById('admin').classList.toggle('show')}function addNotice(){var t=document.getElementById('title').value.trim(),b=document.getElementById('body').value.trim();if(!t||!b){alert('제목과 내용을 입력해 주세요.');return}var st=CAStore.load();st.notices.unshift({id:'N-'+Date.now(),audience:document.getElementById('aud').value,title:t,body:b,createdAt:Date.now(),endsAt:''});CAStore.save(st);document.getElementById('title').value='';document.getElementById('body').value='';render();syncBadge()}function del(id){var st=CAStore.load(),item=(st.notices||[]).find(function(n){return n.id===id});if(!item)return;if(!confirm('이 공지사항을 삭제할까요?\n\n'+item.title))return;st.notices=st.notices.filter(function(n){return n.id!==id});CAStore.save(st);render();syncBadge()}
function render(){var now=Date.now(),st=CAStore.load(),list=(st.notices||[]).filter(function(n){return isAdmin||!n.audience||n.audience==='all'||n.audience===role}).filter(function(n){return !n.endsAt||new Date(n.endsAt).getTime()>=now});document.getElementById('list').innerHTML=list.length?list.map(function(n){var fresh=now-Number(n.createdAt||0)<week;return '<div class="notice"><div class="head"><div class="title"><span class="aud">'+name(n.audience||'all')+'</span>'+esc(n.title)+(fresh?'<span class="new">N</span>':'')+'</div><span class="meta">'+new Date(Number(n.createdAt||now)).toLocaleDateString('ko-KR')+'</span></div><div class="body">'+esc(n.body)+'</div>'+(isAdmin?'<span class="del" onclick="del(\''+n.id+'\')">공지 삭제</span>':'')+'</div>'}).join(''):'<div class="intro">현재 표시할 공지가 없습니다.</div>'}render();
</script></body></html>
