<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>운영 사용자 로그인 (수집·배정형 샘플)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="../assets/augen.css">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  svg{display:block;}
  body.ap2{
    font-family:var(--font,'Pretendard Variable','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif);
    font-weight:350; letter-spacing:-0.02em; color:var(--ink); background:var(--canvas);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 18px 40px;
  }
  .card{width:100%; max-width:360px; background:var(--surface); border-radius:24px; border:0.5px solid var(--hair); padding:clamp(22px,5vw,30px);}
  .mark{width:42px; height:42px; border-radius:12px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; margin-bottom:16px;}
  h1{font-size:17px; font-weight:400; margin-bottom:6px;}
  .sub{font-size:12px; color:var(--steel); line-height:1.6; margin-bottom:22px;}
  label{display:block; font-size:11.5px; color:var(--steel); margin-bottom:6px;}
  input[type=text]{width:100%; border:1.5px solid var(--hair); border-radius:12px; padding:11px 13px; font-size:13.5px; font-family:inherit; color:var(--ink); background:#fff; margin-bottom:8px; text-transform:uppercase;}
  input[type=text]:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-wash);}
  .err{font-size:11.5px; color:#b5432b; min-height:15px; margin-bottom:10px;}
  .btn{width:100%; -webkit-appearance:none; appearance:none; background:var(--ink,#0f1012); background-color:var(--ink,#0f1012); color:#ffffff !important; border:none; box-shadow:none; -webkit-text-fill-color:#ffffff; border-radius:9999px; padding:12px; font-size:13.5px; font-weight:400; cursor:pointer; font-family:inherit;}
  .btn:hover{background:#000;}
  .note{margin-top:14px; font-size:10.5px; color:var(--ash); line-height:1.6; background:var(--canvas); border-radius:12px; padding:10px 12px;}
  .pledge{display:none;margin:0 0 12px;background:#fff8e6;border:1px solid #ead59a;border-radius:13px;padding:11px 12px;color:var(--steel);font-size:11px;line-height:1.55;}
  .pledge.show{display:block;}
  .pledge-title{font-weight:600;color:var(--ink);margin-bottom:6px;}
  .pledge label{display:flex;align-items:flex-start;gap:8px;margin:8px 0 0;color:var(--ink);cursor:pointer;}
  .pledge input{margin-top:2px;flex:none;}
  .btn:disabled{opacity:.42;cursor:not-allowed;}
  .foot{margin-top:18px; padding-top:14px; border-top:0.5px solid var(--hair); font-size:11.5px; color:var(--ash); text-align:center; line-height:1.7;}
  .foot a{color:var(--blue); text-decoration:none;}
</style>
</head>
<body class="ap2">
<script src="../assets/nav.js"></script>

<div class="card">
  <div class="mark">SIC</div>
  <h1 id="loginTitle">운영 사용자 로그인</h1>
  <div class="sub" id="loginSub">VM부가 미리 발급한 운영 코드로만 접속할 수 있습니다. 이름이나 이메일은 입력하지 않습니다.</div>

  <label for="codeInput" id="codeLabel">운영 코드</label>
  <input type="text" id="codeInput" placeholder="예: INT-2027-01" autocomplete="off">
  <div class="err" id="errMsg"></div>

  <div class="pledge" id="callcenterPledge">
    <div class="pledge-title">콜센터 자원봉사자 약식 서약</div>
    <div>업무 중 알게 된 정보는 문의 처리 목적에만 사용하고 외부에 공유하지 않으며, 개인정보 최소화 원칙과 콜센터 운영 지침을 준수하겠습니다.</div>
    <label><input type="checkbox" id="pledgeCheck" onchange="syncLoginButton()"><span>위 내용을 확인했으며 준수하겠습니다.</span></label>
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">로그인</button>

  <div class="note" id="sampleCodes">샘플 코드<br>인터뷰어: INT-2027-01<br>콜센터: CALL-2027-01<br>VM 운영 관리자: VM-ADMIN-27<br>시스템 관리자: SYS-ADMIN-27</div>

  <div class="foot">자원봉사자는 로그인이 필요 없습니다<br><a href="01-applicant-submit.html" onclick="return goHome()">자원봉사자 화면으로 바로 가기</a></div>
</div>

<script src="../assets/store.js"></script>
<script src="../assets/auth.js"></script>
<script>
  var target = new URLSearchParams(location.search).get('for') || '';
  var targetConfig = {
    interviewer: { title:'인터뷰어 로그인', sub:'발급받은 인터뷰어 코드로 로그인해 주십시오. 이름이나 이메일은 입력하지 않습니다.', label:'인터뷰어 코드', placeholder:'예: INT-2027-01', sample:'샘플 코드<br>인터뷰어: INT-2027-01', roles:['interviewer'] },
    admin: { title:'VM 운영 관리자 로그인', sub:'발급받은 관리자 코드로 로그인해 주십시오.', label:'관리자 코드', placeholder:'예: VM-ADMIN-27', sample:'샘플 코드<br>VM 운영 관리자: VM-ADMIN-27<br>시스템 관리자: SYS-ADMIN-27', roles:['admin','system'] },
    callcenter: { title:'콜센터 자원봉사자 로그인', sub:'발급받은 콜센터 코드로 로그인해 주십시오.', label:'콜센터 코드', placeholder:'예: CALL-2027-01', sample:'샘플 코드<br>콜센터: CALL-2027-01', roles:['helpdesk'] }
  };
  var cfg = targetConfig[target];
  if(cfg){
    document.getElementById('loginTitle').textContent=cfg.title;
    document.getElementById('loginSub').textContent=cfg.sub;
    document.getElementById('codeLabel').textContent=cfg.label;
    document.getElementById('codeInput').placeholder=cfg.placeholder;
    document.getElementById('sampleCodes').innerHTML=cfg.sample;
  }
  if(target==='callcenter'){
    document.getElementById('callcenterPledge').classList.add('show');
  }
  function syncLoginButton(){
    var btn=document.getElementById('loginBtn');
    if(target==='callcenter'){
      btn.disabled=!document.getElementById('pledgeCheck').checked;
    } else {
      btn.disabled=false;
    }
  }
  syncLoginButton();
  function embedded(){
    try { return window.parent && window.parent !== window; } catch (e) { return false; }
  }

  function goHome(){
    if (embedded() && typeof window.parent.setTab === 'function') {
      window.parent.setTab('applicant');
      return false;
    }
    return true;
  }

  function doLogin(){
    if(target==='callcenter' && !document.getElementById('pledgeCheck').checked){
      document.getElementById('errMsg').textContent = '약식 서약 내용을 확인하고 체크해 주세요.';
      return;
    }
    var code = document.getElementById('codeInput').value;
    var session = CAAuth.login(code);
    if (!session) {
      document.getElementById('errMsg').textContent = '등록되지 않은 운영 코드입니다. 다시 확인해 주세요.';
      return;
    }
    if(cfg && cfg.roles.indexOf(session.role)===-1){
      CAAuth.logout();
      document.getElementById('errMsg').textContent = '이 화면에서 사용할 수 없는 코드입니다.';
      return;
    }
    if (embedded() && typeof window.parent.CA_afterLogin === 'function') {
      window.parent.CA_afterLogin(session);
    } else {
      location.href = '../app.html';
    }
  }

  document.getElementById('codeInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') doLogin();
  });

  (function(){
    var existing = CAAuth.getSession();
    if (existing) {
      document.getElementById('errMsg').style.color = 'var(--steel)';
      document.getElementById('errMsg').textContent = existing.label + ' 코드로 이미 로그인되어 있습니다.';
    }
  })();
</script>

</body>
</html>
