<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>역할별 문의</title>
<link rel="stylesheet" href="../../assets/augen.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font,'Malgun Gothic',sans-serif);word-break:keep-all}.wrap{max-width:650px;margin:auto;padding:24px 16px 80px}.card,.list{background:#fff;border:.5px solid var(--hair);border-radius:22px;padding:22px;margin-bottom:16px}.who{padding:11px 14px;border-radius:13px;background:var(--blue-wash);color:var(--blue);font-size:12px;margin-bottom:18px}.bubble{background:#fff7d6;border:1px solid #e8cf6b;border-radius:15px;padding:12px 14px;font-size:12px;color:#5c4c00;margin-bottom:16px}.types{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 18px}.type{border:1px solid var(--hair);border-radius:99px;padding:8px 13px;font-size:12px;color:var(--steel);cursor:pointer}.type.on{background:var(--ink);color:#fff}label{font-size:12px;display:block;margin:0 0 7px}textarea{width:100%;border:1px solid var(--hair);border-radius:13px;padding:12px;font:inherit;font-size:13px;min-height:95px;resize:vertical}.btn{width:100%;border:0;border-radius:99px;padding:14px;background:var(--blue);color:#fff;font:inherit;margin-top:14px;cursor:pointer}.empty{font-size:12px;color:var(--ash);text-align:center;padding:16px}.item{padding:12px 0;border-bottom:1px solid var(--hair);font-size:12px}.item:last-child{border:0}.top{display:flex;justify-content:space-between;gap:10px}.tag2{background:var(--canvas);border-radius:99px;padding:2px 8px}.answer{margin-top:7px;color:var(--ink)}.login{display:none;text-align:center}.login.show{display:block}

@media (min-width:900px){
  .wrap{max-width:820px;margin-left:auto;margin-right:auto;}
}

</style></head><body><script src="../assets/nav.js"></script>
<div class="topbar"><div class="brand"><div><h1 id="pageTitle">문의하기</h1><div class="sub">로그인한 역할에 맞는 문의를 접수합니다</div></div></div><div class="tag">DEMO</div></div>
<div class="wrap"><div class="card login" id="loginPanel"><b>먼저 코드를 확인해 주세요</b><p style="font-size:12px;color:var(--steel)">자원봉사자는 예약코드를 확인하고, 인터뷰어는 인터뷰어 코드로 로그인해 주십시오.</p></div><div id="mainPanel"><div class="who" id="who"></div><div class="bubble"><b>먼저 역할별 자주 묻는 질문과 공지사항을 확인해 주세요.</b><br>이름·회중·연락처·이메일·건강 정보는 입력하지 마십시오.</div><div class="card"><label>문의 유형</label><div class="types" id="types"></div><label>추가 설명 (선택)</label><textarea id="body" maxlength="200" placeholder="정형화된 유형만으로 설명하기 어려운 경우에만 200자 이내로 적어 주세요. 개인정보·민감정보는 입력하지 마십시오."></textarea><button class="btn" onclick="submitHelp()">문의 보내기</button></div><div class="list"><b style="font-size:13px">내 문의·답변</b><div id="list"></div></div></div></div>
<script src="../assets/store.js"></script><script src="../assets/auth.js"></script><script>
var session=CAAuth.getSession();var TYPE_MAP={volunteer:['가능한 시간 수정','확정 일정 확인·변경 요청','예약코드 문제','앱 사용 방법','기타 문의'],interviewer:['가용시간 수정','배정 일정·인원 문의','인터뷰 진행 방법','앱 사용 방법','기타 문의'],admin:['일정 변경','배정 결과','앱 사용 방법','기타 문의'],system:['시스템 오류','앱 사용 방법','기타 문의']};var role=session?session.role:'',TYPES=TYPE_MAP[role]||[],selected=TYPES[0]||'';function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function init(){if(!session||['volunteer','interviewer','admin','system'].indexOf(role)<0){document.getElementById('loginPanel').classList.add('show');document.getElementById('mainPanel').style.display='none';return}var label=role==='volunteer'?'자원봉사자':role==='interviewer'?'인터뷰어':'관리자';document.getElementById('pageTitle').textContent=label+' 문의하기';document.getElementById('who').textContent=label+' 코드 '+CAStore.maskCode(session.code)+'로 접속 중 · 문의에 코드가 자동 연결됩니다.';renderTypes();renderList()}
function renderTypes(){document.getElementById('types').innerHTML=TYPES.map(function(t){return '<span class="type'+(t===selected?' on':'')+'" onclick="selectType(\''+t+'\')">'+t+'</span>'}).join('')}function selectType(t){selected=t;renderTypes()}
function submitHelp(){var body=document.getElementById('body').value.trim();var pii=/\b01[016789][- ]?\d{3,4}[- ]?\d{4}\b|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}|(?:서울|경기|인천|부산|대구|광주|대전|울산).{0,12}회중/gi;if(pii.test(body)){alert('개인정보로 보이는 내용을 삭제한 뒤 다시 제출해 주십시오.');return}var st=CAStore.load();st.helpdesk.unshift({id:'H-'+Date.now(),type:selected,reservationCode:session.code,actorRole:role,body:body,status:'접수',answer:'',at:CAStore.nowLabel()});CAStore.addLog(st,CAStore.maskCode(session.code)+' 코드 문의가 접수되었습니다.');CAStore.save(st);document.getElementById('body').value='';renderList();alert('문의가 접수되었습니다.')}
function renderList(){var st=CAStore.load(),mine=(st.helpdesk||[]).filter(function(h){return h.reservationCode===session.code}),el=document.getElementById('list');if(!mine.length){el.innerHTML='<div class="empty">접수한 문의가 없습니다.</div>';return}el.innerHTML=mine.map(function(h){return '<div class="item"><div class="top"><span class="tag2">'+esc(h.type)+'</span><span>'+esc(h.status||'접수')+' · '+esc(h.at)+'</span></div><div>'+esc(h.body||'추가 설명 없음')+'</div>'+(h.answer?'<div class="answer"><b>답변</b> '+esc(h.answer)+'</div>':'')+'</div>'}).join('')}init();
</script></body></html>
