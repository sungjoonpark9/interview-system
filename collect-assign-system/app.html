<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>인터뷰 배정 앱 (데모) · 2027 SIC</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --ink:#0f1012; --canvas:#f2f2f4; --surface:#fdfdfd; --steel:#5e5e5e; --ash:#8f8f8f;
    --blue:#0071e3; --blue-wash:rgba(0,113,227,0.08); --hair:rgba(0,0,0,0.09);
    --font:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font); font-weight:350; letter-spacing:-0.02em; color:var(--ink);
    background:#e3e4e8; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh; padding:0;
  }

  /* ---- 반응형 앱 셸 ----
     모바일: 전체 화면
     태블릿: 넓어진 앱 화면
     PC: 휴대폰 프레임을 제거하고 관리 화면이 충분히 넓게 보이도록 확장
  ---- */
  .device{
    position:relative; width:100%; height:100dvh; max-width:none; max-height:none;
    background:var(--canvas); display:flex; flex-direction:column; overflow:hidden;
  }

  @media (min-width:640px){
    body{ padding:18px; }
    .device{
      width:min(820px, 100%);
      height:calc(100dvh - 36px);
      min-height:620px;
      border-radius:24px;
      border:1px solid rgba(0,0,0,0.08);
      box-shadow:0 18px 48px rgba(0,0,0,0.16);
    }
  }

  @media (min-width:900px){
    body{ padding:24px; align-items:flex-start; }
    .device{
      width:min(1080px, calc(100vw - 48px));
      height:calc(100dvh - 48px);
      min-height:680px;
      border-radius:22px;
      border:1px solid rgba(0,0,0,0.09);
      box-shadow:0 20px 55px rgba(0,0,0,0.14);
    }
    .appbar{ padding:14px 24px 12px; }
    .sessionbar{ padding-left:24px; padding-right:24px; }
    .segrow{ padding-left:24px; padding-right:24px; max-width:900px; margin-left:auto; margin-right:auto; width:100%; }
    .content{ flex:1 1 auto; min-height:0; }
    .tabbar{
      padding:0 18px;
      justify-content:center;
      gap:8px;
      border-top:.5px solid var(--hair);
      background:rgba(253,253,253,0.96);
    }
    .tab{
      flex:0 0 auto;
      min-width:118px;
      flex-direction:row;
      justify-content:center;
      gap:7px;
      padding:11px 16px;
      border-radius:12px;
    }
    .tab:hover{ background:rgba(0,0,0,0.035); }
    .tab svg{ width:18px; height:18px; }
    .tab span{ font-size:11px; }
    .resetfab{ right:18px; bottom:72px; }
  }

  @media (min-width:1200px){
    .device{ width:min(1100px, calc(100vw - 64px)); }
  }

  /* ---- 상단 앱바 ---- */
  .appbar{
    flex-shrink:0; display:flex; align-items:center; gap:10px; padding:calc(16px + env(safe-area-inset-top)) 18px 12px;
    background:rgba(253,253,253,0.92); backdrop-filter:saturate(180%) blur(14px);
    border-bottom:0.5px solid var(--hair); position:relative; z-index:20;
  }
  .appbar .mark{
    width:30px; height:30px; border-radius:9px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; flex-shrink:0;
  }
  .appbar .titles{min-width:0;}
  .appbar h1{font-size:14.5px; font-weight:500; line-height:1.3;}
  .appbar .sub{font-size:10.5px; color:var(--ash); margin-top:1px;}
  .appbar .tag{
    margin-left:auto; font-size:9.5px; font-weight:500; color:var(--blue); background:var(--blue-wash);
    padding:4px 9px; border-radius:9999px; flex-shrink:0; white-space:nowrap;
  }

  /* ---- 로그인 상태 표시줄 (로그인했을 때만 노출) ---- */
  .sessionbar{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 18px; background:var(--blue-wash); border-bottom:0.5px solid var(--hair);
    font-size:11px; color:var(--ink); flex-shrink:0; position:relative; z-index:19;
  }
  .sessionbar.show{ display:flex; }
  .sessionbar b{ font-weight:500; }
  .sessionbar .session-actions{display:flex; align-items:center; gap:12px; flex-shrink:0;}
  .sessionbar button{
    border:none; background:none; color:var(--blue); font-family:inherit; font-size:11px;
    font-weight:500; cursor:pointer; padding:2px 0;
  }
  .sessionbar .homebtn{color:var(--ink);}

  /* ---- 문의 탭 전용 세그먼트 컨트롤 ---- */
  .segrow{ display:none; padding:10px 14px 0; gap:8px; background:var(--canvas); flex-shrink:0; }
  .segrow.show{ display:flex; }
  .seg{
    flex:1; text-align:center; font-size:12px; font-weight:400; color:var(--steel);
    background:var(--surface); border:0.5px solid var(--hair); border-radius:9999px; padding:9px 0; cursor:pointer;
  }
  .seg.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* ---- 콘텐츠 ---- */
  .content{ flex:1; min-height:0; background:var(--canvas); position:relative; }
  .content iframe{ width:100%; height:100%; border:none; display:block; background:var(--canvas); }
  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--ash); background:var(--canvas); pointer-events:none; opacity:0; transition:opacity .15s;
  }
  .loading.show{ opacity:1; }

  /* ---- 하단 탭바 ---- */
  .tabbar{
    flex-shrink:0; display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:rgba(253,253,253,0.94); backdrop-filter:saturate(180%) blur(14px);
    border-top:0.5px solid var(--hair); position:relative; z-index:20;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px;
    border:none; background:none; cursor:pointer; color:var(--ash); font-family:inherit;
  }
  .tab svg{ width:21px; height:21px; }
  .tab span{ font-size:10px; font-weight:400; letter-spacing:-0.01em; }
  .tab.on{ color:var(--blue); }
  .tab.on svg{ stroke:var(--blue); }

  .resetfab{
    position:absolute; right:10px; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:25;
    width:34px; height:34px; border-radius:9999px; background:rgba(15,16,18,0.82); color:#fff;
    border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }

  @media (min-width:900px){
    .device.mode-general .content iframe{ background:var(--canvas); }
    .device.mode-general .content{ padding:0; }
    .device.mode-general .content iframe{ width:100%; }
    .device.mode-admin{ width:min(1160px, calc(100vw - 48px)); }
  }


@media (min-width:900px){
  .device.mode-general{width:min(1080px,calc(100vw - 48px));}
  .device.mode-interviewer,.device.mode-callcenter{width:min(1080px,calc(100vw - 48px));}
  .device.mode-admin{width:min(1180px,calc(100vw - 48px));}
}
</style>
</head>
<body>

<div class="device">
  <div class="appbar">
    <div class="mark">SIC</div>
    <div class="titles">
      <h1 id="screenTitle">홈</h1>
      <div class="sub">2027 서울 국제대회 · 인터뷰 배정 앱</div>
    </div>

  </div>

  <div class="sessionbar" id="sessionbar">
    <span id="sessionLabel"></span>
    <div class="session-actions">
      <button class="homebtn" onclick="setTab('home')" aria-label="홈으로 이동">홈</button>
      <button onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="segrow" id="inquirySeg">
    <div class="seg" id="segNotice" onclick="setInquiry('notice')">공지사항 <span id="noticeNew" style="display:none;color:#e5484d;font-weight:700">N</span></div>
    <div class="seg" id="segHelpdesk" onclick="setInquiry('helpdesk')">문의하기</div>
    <div class="seg" id="segFaq" onclick="setInquiry('faq')">FAQ</div>

  <div class="content">
    <iframe id="frame" src="screens/00-home.html?v=20260824-11" title="app-content"></iframe>

  </div>

  <button class="resetfab" id="resetBtn" title="데모 데이터 초기화" onclick="resetDemo()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
  </button>

  <div class="tabbar" id="tabbar">
    <button class="tab on" data-tab="home" onclick="setTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>홈</span>
    </button>
    <button class="tab" data-tab="applicant" id="tabApplicant" onclick="setTab('applicant')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      <span>자원봉사자</span>
    </button>
    <button class="tab" data-tab="volunteerAssignment" id="tabVolunteerAssignment" onclick="setTab('volunteerAssignment')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span>예약 확인</span>
    </button>
    <button class="tab" data-tab="interviewer" id="tabInterviewer" onclick="setTab('interviewer')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>가능시간 입력</span>
    </button>
    <button class="tab" data-tab="assignment" id="tabAssignment" onclick="setTab('assignment')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span>배정 확인</span>
    </button>
    <button class="tab" data-tab="admin" id="tabAdmin" onclick="setTab('admin')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>관리자</span>
    </button>
    <button class="tab" data-tab="callcenter" id="tabCallcenter" onclick="setTab('callcenter')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H5.2L4 18.5V4z"/><path d="M8 8h8M8 12h5"/></svg>
      <span>콜센터</span>
    </button>
    <button class="tab" data-tab="inquiry" id="tabInquiry" onclick="setTab('inquiry')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      <span>도움말</span>
    </button>
  </div>
</div>

<script src="assets/store.js?v=20260825-6"></script>
<script src="assets/auth.js?v=20260825-6"></script>
<script>
  var SCREENS = {
    home:        { title: '홈', src: 'screens/00-home.html?v=20260825-4' },
    applicant:   { title: '인터뷰 예약', src: 'screens/01-applicant-submit.html?v=20260825-8' },
    volunteerAssignment: { title: '예약 확인', src: 'screens/11-volunteer-assignment.html?v=20260825-2' },
    interviewer: { title: '가능시간 입력', src: 'screens/02-interviewer-submit.html?v=20260825-4' },
    assignment:  { title: '배정 확인', src: 'screens/08-interviewer-assignments.html?v=20260825-3' },
    admin:       { title: '인터뷰 예약 운영 관리', src: 'screens/03-admin-workbook.html?v=20260825-2' },
    callcenter:  { title: '콜센터 문의 처리', src: 'screens/06-callcenter.html?v=20260824-11' },
    inquiry:     { title: '도움말', src: 'screens/07-notices.html?v=20260824-6' }
  };
  var LOGIN_SRC = 'screens/00-login.html';

  var curTab = 'home';
  var curInquiry = 'notice';
  var session = null;          // 현재 로그인 세션 (CAAuth 세션과 동기화)
  var pendingAuthTab = null;   // 로그인 화면을 띄우게 만든 원래 목적 탭

  /* ---------------------------------------------------------------
     접근 권한 규칙
     - 자원봉사자(비로그인): 홈 · 자원봉사자 · 도움말(공지사항/문의하기/FAQ) 이용.
       인터뷰어·관리자 탭을 눌러도 실제 화면 대신 로그인 화면이 뜨고,
       로그인 전에는 인터뷰어·관리자 화면 내용을 볼 수 없습니다.
     - 로그인 전 홈: 역할 선택 화면.
     - 로그인 후 홈: 현재 로그인 역할의 전용 홈(대시보드).
     - 인터뷰어(로그인): 인터뷰어 · 공지·FAQ·문의를 이용.
     - VM 관리자(로그인): 관리자 권한 범위의 메뉴를 이용.
  --------------------------------------------------------------- */
  function isAuthorizedFor(id){
    if (id === 'interviewer' || id === 'assignment') return !!session && session.role === 'interviewer';
    if (id === 'admin') return !!session && session.role === 'admin';
    if (id === 'callcenter') return !!session && ['helpdesk','admin'].indexOf(session.role) >= 0;
    return true;
  }

  function volunteerHasAssignment(){
    if(!session || session.role!=='volunteer' || !session.code) return false;
    try{
      var state=CAStore.load();
      var row=(state.applicants||[]).find(function(r){return r.reservationCode===session.code;});
      return !!(row && row.slotId);
    }catch(e){ return false; }
  }

  function allowedTabIds(){
    if(!session) return ['home','applicant','interviewer','admin','callcenter','inquiry'];

    if(session.role==='volunteer'){
      return volunteerHasAssignment()
        ? ['home','volunteerAssignment','inquiry']
        : ['home','applicant','inquiry'];
    }
    if(session.role==='interviewer') return ['home','interviewer','assignment','inquiry'];
    if(session.role==='helpdesk') return ['home','callcenter','inquiry'];
    if(session.role==='admin') return ['home','admin','inquiry'];
    if(session.role==='system') return ['home','inquiry'];

    return ['home','inquiry'];
  }

  function updateRoleTabLabels(){
    var applicant=document.querySelector('[data-tab="applicant"] span');
    var interviewer=document.querySelector('[data-tab="interviewer"] span');
    var assignment=document.querySelector('[data-tab="assignment"] span');
    var vAssignment=document.querySelector('[data-tab="volunteerAssignment"] span');
    var admin=document.querySelector('[data-tab="admin"] span');
    var callcenter=document.querySelector('[data-tab="callcenter"] span');
    var inquiry=document.querySelector('[data-tab="inquiry"] span');

    // 로그인 전에는 '역할 선택' 메뉴로 보이게 합니다.
    if(!session){
      if(applicant) applicant.textContent='자원봉사자';
      if(interviewer) interviewer.textContent='인터뷰어';
      if(admin) admin.textContent='VM 운영 관리자';
      if(callcenter) callcenter.textContent='콜센터';
      if(inquiry) inquiry.textContent='도움말';
      return;
    }

    // 로그인 후에는 현재 역할의 실제 업무 메뉴 이름으로 바꿉니다.
    if(session.role==='volunteer'){
      if(applicant) applicant.textContent='인터뷰 예약';
      if(vAssignment) vAssignment.textContent='예약 확인';
    }else if(session.role==='interviewer'){
      if(interviewer) interviewer.textContent='가능시간 입력';
      if(assignment) assignment.textContent='배정 확인';
    }else if(session.role==='helpdesk'){
      if(callcenter) callcenter.textContent='콜센터';
    }else if(session.role==='admin' || session.role==='system'){
      if(admin) admin.textContent='VM 운영 관리자';
      if(callcenter) callcenter.textContent='콜센터';
    }

    if(inquiry) inquiry.textContent='도움말';
  }

  function updateTabVisibility(){
    updateRoleTabLabels();
    var allowed = allowedTabIds();
    document.querySelectorAll('.tab').forEach(function(t){
      var id = t.dataset.tab;
      t.style.display = allowed.indexOf(id) === -1 ? 'none' : '';
    });
  }

  function defaultTabForRole(){
    if(!session) return 'home';
    if(session.role==='volunteer') return volunteerHasAssignment() ? 'volunteerAssignment' : 'applicant';
    if(session.role==='interviewer') return 'interviewer';
    if(session.role==='helpdesk') return 'callcenter';
    if(session.role==='admin') return 'admin';
    if(session.role==='system') return 'home';
    return 'home';
  }
  function homeFrameSrc(){
    var base=SCREENS.home.src;
    if(!session) return base+'&homeState=guest#homeState=guest';
    var reserved=session.role==='volunteer' && volunteerHasAssignment();
    var state='homeState=member&role='+encodeURIComponent(session.role)+'&label='+encodeURIComponent(session.label||'')+'&reserved='+(reserved?'1':'0');
    // 일부 localhost 서버가 .html → clean URL로 이동할 때 query를 제거하므로,
    // query를 기본값으로 유지하면서 같은 상태를 fragment에도 보존합니다.
    return base+'&'+state+'#'+state;
  }

  function updateInquirySegments(){
    var maySubmit = !session || session.role==='volunteer' || session.role==='interviewer';
    document.getElementById('segHelpdesk').style.display=maySubmit?'':'none';
    if(!maySubmit && curInquiry==='helpdesk') curInquiry='notice';
    document.getElementById('segNotice').classList.toggle('on',curInquiry==='notice');
    document.getElementById('segHelpdesk').classList.toggle('on',curInquiry==='helpdesk');
    document.getElementById('segFaq').classList.toggle('on',curInquiry==='faq');
  }

  function updateSessionBar(){
    var bar = document.getElementById('sessionbar');
    if (session) {
      bar.classList.add('show');
      var roleLabel = session.role === 'admin' ? 'VM 운영 관리자' : session.role === 'system' ? '시스템 관리자' : session.role === 'helpdesk' ? '콜센터 자원봉사자' : session.role === 'volunteer' ? '자원봉사자' : '인터뷰어';
      document.getElementById('sessionLabel').innerHTML = '<b>' + session.label + '</b> · ' + roleLabel + '로 접속 중';
    } else {
      bar.classList.remove('show');
    }
  }

  function loadSessionFromStorage(){
    try { session = (window.CAAuth && CAAuth.getSession()) || null; } catch (e) { session = null; }
  }
  window.CA_getSession = function(){ return session; };

  function doLogout(){
    try { if (window.CAAuth) CAAuth.logout(); } catch (e) {}
    session = null;
    pendingAuthTab = null;
    updateTabVisibility();
    updateSessionBar();
    updateInquirySegments();
    setTab('home', true);
  }

  // 로그인 화면(iframe 안)에서 로그인에 성공하면 이 함수를 호출합니다.
  window.CA_afterLogin = function (s) {
    session = s;
    updateTabVisibility();
    updateSessionBar();
    var land = pendingAuthTab;
    pendingAuthTab = null;
    if(s && s.role==='interviewer') land='home';
    if (!land || !isAuthorizedFor(land)) {
      land = defaultTabForRole();
    }
    setTab(land);
  };
  window.CA_afterVolunteerLogin = function(s){
    session=s; updateTabVisibility(); updateSessionBar(); updateInquirySegments(); updateNoticeBadge();
    if(volunteerHasAssignment()) setTab('volunteerAssignment');
  };
  function syncSessionUI(){
    loadSessionFromStorage();
    updateTabVisibility();
    updateSessionBar();
    updateInquirySegments();
    updateNoticeBadge();
  }
  window.addEventListener('message', function(e){
    if(e.origin!==location.origin || !e.data) return;
    if(e.data.type==='ca-session-changed'){
      syncSessionUI();
      if(session && session.role==='volunteer' && volunteerHasAssignment()) setTab('volunteerAssignment');
    }else if(e.data.type==='ca-reservation-changed'){
      syncSessionUI();
    }
  });
  window.addEventListener('storage', function(e){
    if(e.key==='vm2027_ca_code_session_v2') syncSessionUI();
  });

  function showLoading(){
    var l = document.getElementById('loading');
    if(!l) return;
    l.classList.add('show');
    clearTimeout(showLoading._t);
    showLoading._t = setTimeout(hideLoading, 4000);
  }

  function hideLoading(){
    var l = document.getElementById('loading');
    if(l) l.classList.remove('show');
    clearTimeout(showLoading._t);
  }

  function setShellMode(id){
    var d=document.querySelector('.device');
    if(!d) return;
    d.classList.remove('mode-general','mode-interviewer','mode-admin','mode-callcenter');
    if(id==='admin') d.classList.add('mode-admin');
    else if(id==='interviewer' || id==='assignment') d.classList.add('mode-interviewer');
    else if(id==='callcenter') d.classList.add('mode-callcenter');
    else d.classList.add('mode-general');
  }

  function setTab(id, forceReload){
        setShellMode(id);
// 방어적 재확인: 로그인 역할에 허용된 하단 메뉴만 사용할 수 있습니다.
    if (session && allowedTabIds().indexOf(id) === -1) {
      id = defaultTabForRole();
    }

    curTab = id;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.tab === id); });

    document.getElementById('inquirySeg').classList.toggle('show', id === 'inquiry');
    if(id==='inquiry') updateInquirySegments();

    document.getElementById('screenTitle').textContent = SCREENS[id].title.split(' · ')[0];

    var src;
    if ((id === 'interviewer' || id === 'assignment' || id === 'admin' || id === 'callcenter') && !isAuthorizedFor(id)) {
      pendingAuthTab = id;
      var loginState='for='+encodeURIComponent(id);
      src = LOGIN_SRC + '?' + loginState + '#' + loginState;
    } else if (id === 'inquiry') {
      src = curInquiry === 'notice' ? 'screens/07-notices.html' : curInquiry === 'faq' ? 'screens/05-faq.html' : 'screens/04-helpdesk.html';
    } else if (id === 'home') {
      src = homeFrameSrc();
    } else {
      src = SCREENS[id].src;
    }
    loadFrame(src, !!forceReload || (id === 'home' && !!session));
  }

  function setInquiry(which){
    curInquiry = which;
    document.getElementById('segNotice').classList.toggle('on', which === 'notice');
    document.getElementById('segHelpdesk').classList.toggle('on', which === 'helpdesk');
    document.getElementById('segFaq').classList.toggle('on', which === 'faq');
    loadFrame(which === 'notice' ? 'screens/07-notices.html' : which === 'faq' ? 'screens/05-faq.html' : 'screens/04-helpdesk.html');
  }

  function loadFrame(src, forceReload){
    var f = document.getElementById('frame');
    function appendParam(url, param){
      var hashIndex=url.indexOf('#');
      var hash=hashIndex>=0 ? url.slice(hashIndex) : '';
      var base=hashIndex>=0 ? url.slice(0,hashIndex) : url;
      return base+(base.indexOf('?')>=0?'&':'?')+param+hash;
    }
    src = appendParam(src, 'v=20260825m');
    if (!forceReload && f.getAttribute('src') === src) return;
    showLoading();
    if (forceReload) {
      src = appendParam(src, 'r=' + Date.now());
    }
    f.setAttribute('src', src);
  }

  function updateNoticeBadge(){
    try{
      var st=window.CAStore ? CAStore.load() : JSON.parse(localStorage.getItem('vm2027_collectassign_code_demo_v5')||'{}');
      var role=session ? session.role : 'volunteer', now=Date.now(), week=7*24*60*60*1000;
      var fresh=(st.notices||[]).some(function(n){ return (!n.audience||n.audience==='all'||n.audience===role) && now-Number(n.createdAt||0)<week; });
      document.getElementById('noticeNew').style.display=fresh?'inline':'none';
    }catch(e){}
  }

  function resetDemo(){
    if (!confirm('이 브라우저에 저장된 데모 데이터를 모두 초기화할까요?\n(운영타임, 팀·정원, 예약, 문의, FAQ 등록 내역이 초기 상태로 돌아갑니다)')) return;
    try { localStorage.removeItem('vm2027_collectassign_code_demo_v6'); } catch (e) {}
    var f = document.getElementById('frame');
    try { f.contentWindow.location.reload(); } catch (e) { location.reload(); }
  }

  (function init(){
    var frame=document.getElementById('frame');
    if(frame){
      frame.addEventListener('load', function(){ hideLoading(); if(session) syncSessionUI(); });
      frame.addEventListener('error', hideLoading);
    }
    loadSessionFromStorage();
    updateTabVisibility();
    updateSessionBar();
    updateInquirySegments();
    updateNoticeBadge();
    setTab(defaultTabForRole());
  })();
</script>

</body>
</html>
